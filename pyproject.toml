[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "business-ops-workbench"
version = "0.1.0"
description = "Local-first business operations diagnostic workbench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4,<2",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<4",
    "PyYAML>=6,<7",
    "streamlit>=1.49,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
